name: 'Claude Code Actions for YassLab team'
description: 'YassLab用にカスタマイズされた Claude AI コードレビュー'
author: 'YassLab Inc.'

branding:
  icon:  'message-circle'
  color: 'blue'

# Docs: https://github.com/anthropics/claude-code-action#readme
inputs:
  additional_permissions:
    description: 'Tell Claude that you are allowed to do given permissions (e.g. Can read CI results)'
    required: false
    default: |
      actions: read

  claude_code_oauth_token:
    description: 'Claude Code API Token'
    required: true

  direct_prompt:
    description: 'Direct prompt for automated review (no @claude mention needed)'
    required: false
    default: |
      Always respond in Japanese, even if given instructions are in English.
      Use Japanese for all outputs, explanations, and comments in code.

      Review this pull request and provide constructive feedback on:
      - Best practices on Ruby, Jekyll, or Ruby on Rails.
      - Critical bugs, security concerns, and performance considerations.
      - General principles on YAGNI, UNIX Philosophy, and Premature Optimization.

      Consider the project's context and existing patterns when suggesting changes.

      All your outputs have to be organized with collapsed sections by using the <details> tags:
      - 🚨 重大な問題 (セキュリティ、破壊的変更)
      - ⚠️ 改善推奨 (ベストプラクティス違反)
      - 💡 提案  (より良い実装方法)
      - ✅ 良い実装 (参考になる箇所)

      Note: Include only relevant sections. Skip if no items in a category.
      Reference: https://docs.github.com/en/get-started/writing-on-github/working-with-advanced-formatting/organizing-information-with-collapsed-sections

      Also note that, for now, you can suggest changes by comments but cannot commit/push to GitHub.

  model:
    description: 'Specify model (default: Claude Opus 5)'
    required: false
    # 日付サフィックス付きスナップショット ID は retire 時に 404 になるため、
    # 日付なしエイリアスを指定する
    default: 'claude-opus-5'
    #default: 'claude-opus-4-8'  # 切り戻し先

  #trigger_phrase:
  #  description: 'Customize the trigger phrase (default: @claude)'
  #  required: false
  #  default: '@claude'

  #base_branch:
  #  description: 'ベースブランチ'
  #  required: false
  #  default: ''

  #max_turns:
  #  description: '最大会話ターン数'
  #  required: false
  #  default: ''

  #timeout_minutes:
  #  description: 'タイムアウト（分）'
  #  required: false
  #  default: ''

  allowed_tools:
    description: 'Allow specific tools to exec'
    required: false
    # Ruby 系コマンド (bundle, rake, rails, rspec, rubocop など) と、READ 系コマンドを許可
    #
    # ⚠️ bundle 系は Gemfile や spec を評価するため、実質的に任意コード実行になる。
    #    Action は fork PR のブランチも runner にチェックアウトするので、認証ステップで
    #    Issue/PR の作成者もメンバーであることを確認している（非メンバーの PR は実行しない）。
    #    ここに実行系コマンドを足す時は、その前提が崩れていないか必ず確認すること。
    #
    # 注: Glob/Grep/LS/Read は Action 側が常に付与するため、ここでの指定は明示のためのもの。
    default: 'Bash(bundle install:*),Bash(bundle update:*),Bash(bundle exec rake:*),Bash(bundle exec rails:*),Bash(bundle exec rspec:*),Bash(bundle exec rubocop:*),Edit,MultiEdit,Glob,Grep,LS,Read,Task,TodoWrite,WebFetch,WebSearch,Write'
    # 要検討: WRITE 系コマンドは制限する? 例: Write(spec/**)
    # https://docs.anthropic.com/en/docs/claude-code/settings#tools-available-to-claude

  disallowed_tools:
    description: 'Disallow specific tools to exec'
    required: false
    # PR 内での自動コミットおよび権限取得コマンドなどを明示的に禁止
    default: 'Bash(git commit:*),Bash(git push:*),Bash(rm -rf:*),Bash(sudo:*)'

  #custom_instructions:
  #  description: 'カスタム指示'
  #  required: false
  #  default: ''

  # Optional: Customize the trigger phrase (default: @claude)
  # trigger_phrase: "/claude"

  # Optional: Trigger when specific user is assigned to an issue
  # assignee_trigger: "claude-bot"

  # Optional: Allow Claude to run specific commands
  # allowed_tools: "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"

  # Optional: Add custom instructions for Claude to customize its behavior for your project
  # custom_instructions: |
  #   Follow our coding standards
  #   Ensure all new code has tests
  #   Use TypeScript for new files

  # Optional: Custom environment variables for Claude
  # claude_env: |
  #   NODE_ENV: test

  # Optional: Use sticky comments to make Claude reuse the same comment on subsequent pushes to the same PR
  # use_sticky_comment: true

  # Optional: Customize review based on file types
  # direct_prompt: |
  #   Review this PR focusing on:
  #   - For TypeScript files: Type safety and proper interface usage
  #   - For API endpoints: Security, input validation, and error handling
  #   - For React components: Performance, accessibility, and best practices
  #   - For tests: Coverage, edge cases, and test quality

  # Optional: Different prompts for different authors
  # direct_prompt: |
  #   ${{ github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' &&
  #   'Welcome! Please review this PR from a first-time contributor. Be encouraging and provide detailed explanations for any suggestions.' ||
  #   'Please provide a thorough code review focusing on our coding standards and best practices.' }}

  # Optional: Add specific tools for running tests or linting
  # allowed_tools: "Bash(npm run test),Bash(npm run lint),Bash(npm run typecheck)"
  #
  # Optional: Skip review for certain conditions
  # if: |
  #   !contains(github.event.pull_request.title, '[skip-review]') &&
  #   !contains(github.event.pull_request.title, '[WIP]')

runs:
  using: 'composite'
  steps:
    - name:  Check if available members
      id:    auth
      shell: bash
      # ${{ }} を run 内に直接展開せず env 経由で渡す（スクリプトインジェクション対策）
      env:
        # ACTOR: このイベントを起こした本人。全 webhook payload に存在する。
        #   イベント別のフォールバックは使わない。たとえば pull_request_review で
        #   PR 作成者にフォールバックすると、非メンバーがメンバーの PR に
        #   レビューを付けるだけでメンバーとして通過できてしまう。
        ACTOR:  ${{ github.event.sender.login }}
        # AUTHOR: Claude が読み込む内容（PR の差分・Issue 本文）の作成者。
        #   Action は fork PR のブランチも runner にチェックアウトするため、
        #   作成者を検証しないと非メンバーのコードが実行され得る。
        AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      run: |
        set -euo pipefail

        deny() {
          echo "::warning::実行しません: $1"
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          exit 0
        }

        # 空文字は必ず拒否する。members.json 側に空の username_github が
        # 混入した場合に、空の ACTOR が一致してしまう事故を防ぐ。
        [ -n "$ACTOR" ]  || deny "イベントを起こしたユーザーを特定できません"
        [ -n "$AUTHOR" ] || deny "Issue/PR の作成者を特定できません"

        # 取得失敗・タイムアウト・HTTP エラーはすべて拒否側に倒す
        MEMBERS="$(curl -fsS --proto '=https' --max-time 10 --retry 2 \
                        https://yasslab.jp/members.json)" \
          || deny "メンバー一覧を取得できません"

        # jq への文字列補間を避け --arg で渡す。GitHub のログイン名は
        # 大文字小文字を区別しないため、両辺を小文字化して比較する。
        is_member() {
          printf '%s' "$MEMBERS" | jq -e --arg u "$1" '
            any(.[]; (.username_github // "") as $m
                     | $m != "" and ($m | ascii_downcase) == ($u | ascii_downcase))
          ' > /dev/null
        }

        is_member "$ACTOR" || deny "$ACTOR はメンバーではありません"

        # 作成者チェック。Dependabot だけは静的に許可する。
        #   - GitHub のユーザー名に [ ] は使えず、dependabot のアプリスラッグは
        #     GitHub が保有しているため、この名前は詐称できない
        #   - Dependabot は fork ではなく対象リポジトリ内にブランチを作るため、
        #     PR に含まれるのは write 権限保持者が管理する依存更新のみ
        #   - 依存更新の bundle install は CI が既に実行しており、新たなリスクはない
        if [ "$AUTHOR" != "dependabot[bot]" ]; then
          is_member "$AUTHOR" || deny "対象の Issue/PR の作成者 $AUTHOR がメンバーではありません"
        fi

        echo "::notice::承認: $ACTOR (対象の作成者: $AUTHOR)"
        echo "authorized=true" >> "$GITHUB_OUTPUT"

    # Docs: https://github.com/anthropics/claude-code-action#readme
    - name: Claude Code Actions
      if: steps.auth.outputs.authorized == 'true'
      uses: anthropics/claude-code-action@beta
      with:
        allowed_tools:           ${{ inputs.allowed_tools }}
        disallowed_tools:        ${{ inputs.disallowed_tools }}
        additional_permissions:  ${{ inputs.additional_permissions }}
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        direct_prompt:           ${{ inputs.direct_prompt }}
        model:                   ${{ inputs.model }}
        #trigger_phrase:          ${{ inputs.trigger_phrase }}
        #base_branch:             ${{ inputs.base_branch }}
        #max_turns:               ${{ inputs.max_turns }}
        #timeout_minutes:         ${{ inputs.timeout_minutes }}
        #custom_instructions:     ${{ inputs.custom_instructions }}
