name: 'Claude Code Actions for YassLab team'
description: 'YassLab用にカスタマイズされた Claude AI コードレビュー'
author: 'YassLab Inc.'

branding:
  icon:  'message-circle'
  color: 'blue'

# Docs: https://github.com/anthropics/claude-code-action#readme
inputs:
  additional_permissions:
    description: 'Tell Claude that you are allowed to do given permissions (e.g. Can read CI results)'
    required: false
    default: |
      actions: read

  claude_code_oauth_token:
    description: 'Claude Code API Token'
    required: true

  system_prompt:
    description: 'Appended to the system prompt (style and default behavior)'
    required: false
    # v1 では prompt を渡すと automation モードになり @claude の指示が無視される。
    # 渡さずに interactive モードで動かし、常に効かせたい規範だけをここに置く。
    # これにより「@claude review this」なら定型レビュー、具体的な指示があれば
    # その指示に従う、という使い分けが分岐なしで成立する。
    #
    # ⚠️ 記法の制約: この文字列は claude_args 内でダブルクォートに囲まれて
    #    shell-quote に渡される。次を使うと壊れる（Validate inputs で検査している）。
    #      - ダブルクォート
    #      - 行頭の # （トークナイズ前にコメントとして行ごと削除される）
    #      - $ とバッククォート（shell-quote が展開を試みる）
    default: |
      Always respond in Japanese, even if the instructions are written in English.
      Use Japanese for all outputs, explanations, and code comments.

      If the person who mentioned you gave a specific instruction, follow it.
      If they did not, review the changes and give constructive feedback on:
      - Best practices on Ruby, Jekyll, or Ruby on Rails.
      - Critical bugs, security concerns, and performance considerations.
      - General principles on YAGNI, UNIX Philosophy, and Premature Optimization.

      Consider the project context and existing patterns when suggesting changes.

      You can edit files locally to verify your reasoning, but you cannot commit or push.
      Present any change you propose as a diff in your comment, not as a commit.

      When you write a review, organize it with collapsed sections using <details> tags:
      - 🚨 重大な問題 (セキュリティ、破壊的変更)
      - ⚠️ 改善推奨 (ベストプラクティス違反)
      - 💡 提案 (より良い実装方法)
      - ✅ 良い実装 (参考になる箇所)

      Include only relevant sections. Skip a category when it has no items.

  model:
    description: 'Specify model (default: Claude Opus 5)'
    required: false
    # 日付サフィックス付きスナップショット ID は retire 時に 404 になるため、
    # 日付なしエイリアスを指定する
    default: 'claude-opus-5'
    #default: 'claude-opus-4-8'  # 切り戻し先

  allowed_tools:
    description: 'Allow specific tools to exec'
    required: false
    # Ruby 系コマンド (bundle, rake, rspec, rubocop など) を許可する。
    #
    # ⚠️ bundle 系は Gemfile や Rakefile、spec を評価するため、実質的に任意コード実行になる。
    #    Action は fork PR のブランチも runner にチェックアウトするので、認証ステップで
    #    Issue/PR の作成者もメンバーであることを確認している（非メンバーの PR は実行しない）。
    #    ここに実行系コマンドを足す時は、その前提が崩れていないか必ず確認すること。
    #
    # ⚠️ Edit / MultiEdit / Write は書かない。
    #    Action 側は意図的にこれらを外し、--permission-mode acceptEdits によって
    #    「workspace 内の編集のみ自動許可、外（~/.bashrc など）は拒否」にしている。
    #    ここに列挙すると runner 全体への書き込みを解禁してしまう。
    #    (anthropics/claude-code-action の src/modes/tag/index.ts のコメント参照)
    #
    # 注: Glob / Grep / LS / Read は Action 側が常に付与するため、ここには書かない。
    default: 'Bash(bundle install:*),Bash(bundle update:*),Bash(bundle exec rake:*),Bash(bundle exec rails:*),Bash(bundle exec rspec:*),Bash(bundle exec rubocop:*),Task,TodoWrite,WebFetch,WebSearch'

  disallowed_tools:
    description: 'Disallow specific tools to exec'
    required: false
    # PR 内での自動コミットおよび権限取得コマンドを明示的に禁止する。
    #
    # 注: Bash(git push:*) は書いても効かない。Action は push を
    #     scripts/git-push.sh 経由で許可するため、このパターンにマッチしない。
    #     コミットを止めることで push まで止める形にしている。
    #
    # 注: mcp__github_file_ops__* は use_commit_signing: true にした時だけ
    #     Action 側が付与する。今は無効だが、有効にした瞬間に Bash パターンの
    #     deny をすり抜けてコミットできてしまうため、先に塞いでおく。
    default: 'Bash(git commit:*),Bash(git add:*),Bash(git rm:*),Bash(rm -rf:*),Bash(sudo:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files'

  # v1 で使える主なオプション（必要になったら有効化する）
  #
  #   trigger_phrase      メンション語を変える (既定: @claude)
  #   assignee_trigger    Issue の担当者アサインで起動する
  #   label_trigger       ラベル付与で起動する
  #   base_branch         ブランチ作成時の分岐元
  #   use_sticky_comment  PR へのコメントを 1 つに集約する
  #   settings            Claude Code の設定を JSON で渡す (環境変数など)
  #
  # 以下は v1 で claude_args の CLI フラグに移行した。上の claude_args に足す。
  #
  #   max_turns           --max-turns 10
  #   custom_instructions --append-system-prompt (この Action では system_prompt)
  #   mcp_config          --mcp-config
  #
  # timeout_minutes は廃止。呼び出し元のジョブで timeout-minutes を指定する。

runs:
  using: 'composite'
  steps:
    # claude_args は shell-quote でトークナイズされるため、壊れる文字が混ざると
    # ツール指定がサイレントに無効化される。無言で権限が変わるより、明示的に落とす。
    - name:  Validate inputs
      shell: bash
      env:
        SYSTEM_PROMPT:    ${{ inputs.system_prompt }}
        ALLOWED_TOOLS:    ${{ inputs.allowed_tools }}
        DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}
        MODEL:            ${{ inputs.model }}
      run: |
        set -euo pipefail

        fail() { echo "::error::$1"; exit 1; }

        for name in SYSTEM_PROMPT ALLOWED_TOOLS DISALLOWED_TOOLS MODEL; do
          value="${!name}"
          # 空だと nextArg が falsy になり、Action 側が積んだ値ごと null で
          # 上書きされる (base-action/src/parse-sdk-options.ts)。ツールが
          # 無言で全て消えるため、空は必ず落とす。
          [ -n "$value" ] || fail "$name が空です"
          case "$value" in
            *'"'*)  fail "$name にダブルクォートは使えません (claude_args の引用が壊れます)" ;;
            *'\'*)  fail "$name にバックスラッシュは使えません (末尾にあると閉じ引用符が無効化されます)" ;;
            *'`'*)  fail "$name にバッククォートは使えません" ;;
            *'$'*)  fail "$name に \$ は使えません (shell-quote が展開を試みます)" ;;
          esac
        done

        # 単一行で渡す値に改行が混ざると、後続がフラグとして解釈されうる
        for name in ALLOWED_TOOLS DISALLOWED_TOOLS MODEL; do
          case "${!name}" in
            *$'\n'*) fail "$name に改行は使えません" ;;
          esac
        done

        # 行頭 # の行は、トークナイズ前にコメントとして行ごと削除される
        if printf '%s\n' "$SYSTEM_PROMPT" | grep -qE '^[[:space:]]*#'; then
          fail "SYSTEM_PROMPT の行頭に # は使えません (その行が無言で削除されます)"
        fi

    - name:  Check if available members
      id:    auth
      shell: bash
      # ${{ }} を run 内に直接展開せず env 経由で渡す（スクリプトインジェクション対策）
      env:
        # ACTOR: このイベントを起こした本人。全 webhook payload に存在する。
        #   イベント別のフォールバックは使わない。たとえば pull_request_review で
        #   PR 作成者にフォールバックすると、非メンバーがメンバーの PR に
        #   レビューを付けるだけでメンバーとして通過できてしまう。
        ACTOR:  ${{ github.event.sender.login }}
        # AUTHOR: Claude が読み込む内容（PR の差分・Issue 本文）の作成者。
        #   Action は fork PR のブランチも runner にチェックアウトするため、
        #   作成者を検証しないと非メンバーのコードが実行され得る。
        AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      run: |
        set -euo pipefail

        deny() {
          echo "::warning::実行しません: $1"
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          exit 0
        }

        # 空文字は必ず拒否する。members.json 側に空の username_github が
        # 混入した場合に、空の ACTOR が一致してしまう事故を防ぐ。
        [ -n "$ACTOR" ]  || deny "イベントを起こしたユーザーを特定できません"
        [ -n "$AUTHOR" ] || deny "Issue/PR の作成者を特定できません"

        # 取得失敗・タイムアウト・HTTP エラーはすべて拒否側に倒す
        MEMBERS="$(curl -fsS --proto '=https' --max-time 10 --retry 2 \
                        https://yasslab.jp/members.json)" \
          || deny "メンバー一覧を取得できません"

        # jq への文字列補間を避け --arg で渡す。GitHub のログイン名は
        # 大文字小文字を区別しないため、両辺を小文字化して比較する。
        is_member() {
          printf '%s' "$MEMBERS" | jq -e --arg u "$1" '
            any(.[]; (.username_github // "") as $m
                     | $m != "" and ($m | ascii_downcase) == ($u | ascii_downcase))
          ' > /dev/null
        }

        is_member "$ACTOR" || deny "$ACTOR はメンバーではありません"

        # 作成者チェック。Dependabot だけは静的に許可する。
        #   - GitHub のユーザー名に [ ] は使えず、dependabot のアプリスラッグは
        #     GitHub が保有しているため、この名前は詐称できない
        #   - Dependabot は fork ではなく対象リポジトリ内にブランチを作るため、
        #     PR に含まれるのは write 権限保持者が管理する lockfile 更新のみ
        #
        # ただし「CI も bundle install しているから同じ」ではない。CI のジョブに
        # CLAUDE_CODE_OAUTH_TOKEN は無いため、こちらで bundle install を走らせると
        # CI には無かった露出が増える（gem のビルドスクリプトは任意コード実行）。
        if [ "$AUTHOR" != "dependabot[bot]" ]; then
          is_member "$AUTHOR" || deny "対象の Issue/PR の作成者 $AUTHOR がメンバーではありません"
        fi

        # Claude が読むコメントをメンバーのものだけに絞るため、名前一覧を渡す。
        # 非メンバーのコメントが混ざると、そこに書かれた文章を指示として
        # 解釈してしまう余地が残る（プロンプトインジェクション）。
        #
        # このリストは allowlist として働き、載っていない投稿者のコメントは
        # すべて落ちる。そのため次の 2 つを必ず含める。
        #   dependabot[bot] : 依存更新の説明をコメントに書くため
        #   claude[bot]     : Claude 自身の過去のレビュー。外すと
        #                     「さっきの 2 番目の指摘を直して」が通じなくなる
        #
        # ユーザー名として不正な文字列は落とす（$GITHUB_OUTPUT の行が壊れないように）
        #
        # ⚠️ jq の正規表現エンジンは Oniguruma (Ruby 系) なので ^ と $ は行単位に
        #    マッチする。^...$ だと末尾に改行を持つ値 ("abc\n") が通り抜けてしまう。
        #    文字列全体の境界判定には \A と \z を使うこと。
        COMMENT_AUTHORS="$(printf '%s' "$MEMBERS" | jq -r '
          [ .[].username_github
            | select(type == "string")
            | select(test("\\A[A-Za-z0-9-]+\\z"))
          ] | join(",")')"
        echo "members=${COMMENT_AUTHORS},dependabot[bot],claude[bot]" >> "$GITHUB_OUTPUT"

        echo "::notice::承認: $ACTOR (対象の作成者: $AUTHOR)"
        echo "authorized=true" >> "$GITHUB_OUTPUT"

    # Docs: https://github.com/anthropics/claude-code-action#readme
    - name: Claude Code Actions
      if: steps.auth.outputs.authorized == 'true'
      # 可変タグを使う。一度 SHA で固定したが、次の理由で戻した。
      #
      #   - upstream は週に数回リリースするため、固定すると急速に古くなる。
      #     既知の脆弱性が公開された版に留まり続ける方が危険
      #   - SHA + Dependabot の利点は「時間差」であって「レビュー」ではない。
      #     バンドルされた Action の差分を実際に読む人はいないため、
      #     PR を挟んでも検知にはつながらない
      #   - その時間差に週次の PR 対応を払う価値があるか、という判断で見送った
      #
      # 判断を見直すのは、upstream のリリース頻度が落ちた時か、
      # Action の差分を実際にレビューする運用を始める時。
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        additional_permissions:  ${{ inputs.additional_permissions }}
        # 非メンバーのコメントをコンテキストから除去する
        include_comments_by_actor: ${{ steps.auth.outputs.members }}
        # prompt は渡さない。渡すと automation モードになり @claude の指示が
        # 無視される。渡さないことで interactive モードになり、メンションの
        # 内容がそのまま指示になる（指示がなければ system_prompt に従って
        # 定型レビューを行う）。
        claude_args: |
          --model "${{ inputs.model }}"
          --allowedTools "${{ inputs.allowed_tools }}"
          --disallowedTools "${{ inputs.disallowed_tools }}"
          --append-system-prompt "${{ inputs.system_prompt }}"
